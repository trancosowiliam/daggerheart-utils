<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fabricador de Itens</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Fabricador de Itens</h1>

        <section class="fabricador">

            <!-- Nome -->
            <div class="campo nome">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do item"
                >
            </div>

            <!-- Atributo -->
            <div class="campo">
                <label for="atributo">Atributo</label>

                <select id="atributo">
                    <option value="">Selecione</option>
                    <option value="forca">Força</option>
                    <option value="agilidade">Agilidade</option>
                    <option value="acuidade">Acuidade</option>
                    <option value="presenca">Presença</option>
                    <option value="instinto">Instinto</option>
                    <option value="conhecimento">Conhecimento</option>
                </select>
            </div>

            <!-- Distância -->
            <div class="campo">
                <label for="distancia">Distância</label>

                <select id="distancia">
                    <option value="">Selecione</option>
                    <option value="cac">Corpo a Corpo</option>
                    <option value="muito-perto">Muito Perto</option>
                    <option value="perto">Perto</option>
                    <option value="distante">Distante</option>
                    <option value="muito-distante">Muito Distante</option>
                </select>
            </div>

            <!-- Empunhadura -->
            <div class="campo">
                <label for="empunhadura">Empunhadura</label>

                <select id="empunhadura">
                    <option value="">Selecione</option>
                    <option value="1">Uma mão</option>
                    <option value="2">Duas mãos</option>
                </select>
            </div>

            <!-- Habilidade -->
            <div class="campo">
                <label for="habilidade">Habilidade</label>

                <select id="habilidade" disabled>
                    <option value="">Selecione os valores acima</option>
                </select>
            </div>

        </section>

        <section class="resultado">

            <h2>Item</h2>

            <div id="resultado">
                Preencha os campos acima para criar seu item.
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
